# Governing contract: spec/ci.md §7 in the source monorepo; see RELEASING.md.
name: dotnet release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this tag after checks (also requires RELEASE_PUBLISH_ENABLED)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: component-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python3 vendor/release-tools/release.py validate

  previous:
    # A rerun of the same tag publishes from the verified artifacts of an earlier
    # run on this commit whose checks all passed, instead of verifying the
    # identical commit again; the publish job still checks the artifact's
    # recorded tag, repository and commit against its checkout.
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.previous.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 vendor/release-tools/release.py previous

  checks:
    needs: [validate, previous]
    if: needs.previous.outputs.run_id == ''
    uses: ./.github/workflows/ci.yml
    with:
      release: true

  publish:
    needs: [validate, previous, checks]
    # checks is skipped when an earlier run's verified artifacts are reused.
    if: >-
      !cancelled() && needs.validate.result == 'success' && needs.previous.result == 'success'
      && (needs.checks.result == 'success' || (needs.checks.result == 'skipped' && needs.previous.outputs.run_id != ''))
      && vars.RELEASE_PUBLISH_ENABLED == 'true' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
      # Downloading a previous run's artifacts.
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v8
        with:
          name: release-Linux
          path: release-artifacts/
          run-id: ${{ needs.previous.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify artifact source and contents
        run: python3 vendor/release-tools/release.py verify
      - name: Open the GitHub Release draft before publishing anything
        # Opened first so a rerun only uploads assets and publishes the draft;
        # when the token cannot open it, nothing has been published yet and the
        # step prints the one command that opens the draft by hand.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 vendor/release-tools/release.py draft
      - name: Check existing registry versions
        id: registry
        run: python3 vendor/release-tools/release.py status
      - uses: NuGet/login@v1
        if: steps.registry.outputs.nuget_exists != 'true'
        id: nuget
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish verified NuGet package
        if: steps.registry.outputs.nuget_exists != 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: dotnet nuget push release-artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
      - name: Verify registry contents and installation
        run: |
          python3 vendor/release-tools/release.py wait
          python3 vendor/release-tools/release.py smoke --registry
      - name: Create or finish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 vendor/release-tools/release.py github
